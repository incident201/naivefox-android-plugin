name: Build NaiveFox Android plugin

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naivefox-android-plugin-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_NDK_REVISION: "29.0.14206865"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_PLATFORM: "36"
  ANDROID_SIGNING_CERT_SHA256: "cfa66ddf7b9cd4e880164e2a4679b3d2fc40ed4117d1503647e2545254385d1d"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build and verify three transport APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out plugin source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare persistent release signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          signing_store="$RUNNER_TEMP/naivefox-plugin-release.p12"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode >"$signing_store"
          chmod 600 "$signing_store"
          keytool -list \
            -keystore "$signing_store" \
            -storetype PKCS12 \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Verify repository contains no generated runtime or APK
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(apk|aab|so|tar\.xz)$'; then
            echo 'Generated runtime/APK content must not be committed' >&2
            exit 1
          fi
          if git grep -nE 'naivefox-20[0-9]{6}-[0-9a-f]{7,40}' -- .; then
            echo 'A concrete NaiveFox release tag is hard-coded in tracked source' >&2
            exit 1
          fi

      - name: Run runtime contract tests
        shell: bash
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tests -v

      - name: Fetch and verify latest NaiveFox Android runtime
        id: runtime
        shell: bash
        run: bash scripts/fetch-naivefox-runtime.sh "$RUNNER_TEMP/naivefox-runtime"

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_REVISION}"
          ndk_home="${ANDROID_HOME}/ndk/${ANDROID_NDK_REVISION}"
          test -f "$ndk_home/source.properties"
          grep -Fqx "Pkg.Revision = ${ANDROID_NDK_REVISION}" "$ndk_home/source.properties"
          echo "ANDROID_NDK_HOME=$ndk_home" >>"$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS_HOME=${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}" \
            >>"$GITHUB_ENV"

      - name: Inspect runtime ELF files
        shell: bash
        env:
          RUNTIME_ROOT: ${{ steps.runtime.outputs.runtime_root }}
        run: |
          set -euo pipefail
          readelf="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          while IFS= read -r -d '' library; do
            "$readelf" --file-header "$library" >"$RUNNER_TEMP/runtime-elf-header.txt"
            grep -Eq '^  Class:[[:space:]]+ELF64$' "$RUNNER_TEMP/runtime-elf-header.txt"
            grep -Eq '^  Machine:[[:space:]]+AArch64$' "$RUNNER_TEMP/runtime-elf-header.txt"
          done < <(find "$RUNTIME_ROOT" -type f -name '*.so' -print0)
          libxul="$RUNTIME_ROOT/${{ steps.runtime.outputs.runtime_path }}/libxul.so"
          symbols=$(
            "$readelf" --dyn-syms --wide "$libxul" |
              awk '$5 ~ /GLOBAL|WEAK/ && $6 == "DEFAULT" && $7 != "UND" && $8 ~ /^NaiveFox/ { sub(/@.*/, "", $8); print $8 }' |
              sort -u
          )
          grep -Fqx 'NaiveFoxRunEmbedded' <<<"$symbols"
          grep -Fqx 'NaiveFoxRequestStop' <<<"$symbols"
          grep -Fqx 'NaiveFoxVersion' <<<"$symbols"

      - name: Build and stage three ARM64 transport launchers
        shell: bash
        env:
          RUNTIME_ROOT: ${{ steps.runtime.outputs.runtime_root }}
        run: bash scripts/build-launchers.sh

      - name: Lint and assemble three signed release APKs
        shell: bash
        env:
          NAIVEFOX_SIGNING_STORE_FILE: ${{ runner.temp }}/naivefox-plugin-release.p12
          NAIVEFOX_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          NAIVEFOX_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          NAIVEFOX_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            -PpluginVersionCode="${GITHUB_RUN_NUMBER}" \
            -PpluginVersionName="${{ steps.runtime.outputs.release_tag }}" \
            :app:lintClassicRelease :app:assembleClassicRelease \
            :app:lintNoConnectRelease :app:assembleNoConnectRelease \
            :app:lintNoConnectHybridRelease :app:assembleNoConnectHybridRelease

      - name: Verify three APKs and fixed transport selection
        shell: bash
        env:
          RUNTIME_ROOT: ${{ steps.runtime.outputs.runtime_root }}
          RUNTIME_RELEASE_TAG: ${{ steps.runtime.outputs.release_tag }}
          RUNTIME_VERSION: ${{ steps.runtime.outputs.runtime_version }}
          RUNTIME_ARCHIVE: ${{ steps.runtime.outputs.archive_name }}
          RUNTIME_ARCHIVE_SHA256: ${{ steps.runtime.outputs.archive_sha256 }}
        run: bash scripts/verify-apks.sh

      - name: Upload Classic APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: naivefox-plugin-${{ steps.runtime.outputs.release_tag }}-classic-arm64-v8a
          path: dist/classic/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload No-connect APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: naivefox-plugin-${{ steps.runtime.outputs.release_tag }}-no-connect-arm64-v8a
          path: dist/no-connect/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload No-connect Hybrid APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: naivefox-plugin-${{ steps.runtime.outputs.release_tag }}-no-connect-hybrid-arm64-v8a
          path: dist/no-connect-hybrid/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish three transports in one GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          plugin_revision="${GITHUB_SHA:0:12}"
          release_tag="naivefox-plugin-${{ steps.runtime.outputs.release_tag }}-${plugin_revision}"
          release_title="NaiveFox Android plugin ${{ steps.runtime.outputs.release_tag }} (${plugin_revision})"
          release_notes=$'Three ARM64 Android APKs from the same latest NaiveFox runtime.\n\nChoose classic for standard Naive-compatible CONNECT servers; no-connect for strict H2/H3 finite exchanges; or experimental no-connect-hybrid for H2/H3 startup followed by native WebSocket over TLS/TCP. The two no-connect variants require matching server support.\n\nAll APKs use the same package ID and persistent release key: install only one; installing another variant switches transport in place. Each APK includes a checksum and transport-specific build metadata. The Exclave profile, JSON bytes, and credentials are unchanged.'
          release_files=(dist/classic/* dist/no-connect/*)
          release_files+=(dist/no-connect-hybrid/*)
          test "${#release_files[@]}" = 9
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --notes "$release_notes" --latest
            gh release upload "$release_tag" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes "$release_notes" --latest
          fi
